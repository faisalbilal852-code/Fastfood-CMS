backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "settings"
    label: "Shop Settings"
    files:
      - file: "content/settings.json"
        label: "Shop Info"
        name: "settings"
        fields:
          - {label: "Shop Name", name: "shop_name", widget: "string"}
          - {label: "Hero Title (Homepage bara heading)", name: "hero_title", widget: "string"}
          - {label: "Hero Subtitle", name: "hero_subtitle", widget: "string"}
          - {label: "Address", name: "address", widget: "string"}
          - {label: "WhatsApp Number (bina + ke, jaise 923138792056)", name: "whatsapp_number", widget: "string"}
          - {label: "Minimum Order Amount (Rs)", name: "min_order", widget: "number"}
          - {label: "Footer Text", name: "footer_text", widget: "string"}

  - name: "menu"
    label: "Menu Items"
    files:
      - file: "content/menu.json"
        label: "All Menu Items"
        name: "menu"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            summary: "{{fields.name}} ({{fields.category}})"
            fields:
              - {label: "ID (unique number, kabhi repeat na karein)", name: "id", widget: "number"}
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Pizza", "Burger", "Shawarma", "Fried", "Fries", "Drinks", "PizzaDeal", "BurgerDeal"]
              - {label: "Item Name", name: "name", widget: "string"}
              - {label: "Description", name: "desc", widget: "string"}
              - {label: "Image", name: "image", widget: "image", required: false}
              - label: "Prices"
                name: "prices"
                widget: "list"
                summary: "{{fields.size}}: Rs {{fields.price}}"
                fields:
                  - {label: "Size Label (jaise Small, Medium, Large, XL, ya Fixed)", name: "size", widget: "string"}
                  - {label: "Price (Rs)", name: "price", widget: "number"}
